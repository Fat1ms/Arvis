<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arvis — Вход</title>
</head>
<body>
  <h1>Вход</h1>

  <form id="loginForm">
    <div>
      <label>Username <input name="username" required minlength="3" /></label>
    </div>
    <div>
      <label>Password <input name="password" type="password" required /></label>
    </div>
    <button type="submit">Войти</button>
  </form>

  <p><a href="/web/register.html">Нет аккаунта? Регистрация</a></p>
  <p><a href="/web/index.html">На главную</a></p>

  <pre id="out"></pre>

  <script>
    const out = document.getElementById('out');
    const form = document.getElementById('loginForm');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      out.textContent = '';

      const fd = new FormData(form);
      const payload = {
        username: String(fd.get('username') || ''),
        password: String(fd.get('password') || ''),
      };

      const resp = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        out.textContent = JSON.stringify(data, null, 2);
        return;
      }

      localStorage.setItem('arvis_token', data.access_token);
      location.href = '/web/account.html';
    });
  </script>
</body>
</html>
