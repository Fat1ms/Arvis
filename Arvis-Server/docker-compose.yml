version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: arvis_lds
      POSTGRES_PASSWORD: dev_password_change_in_prod
      POSTGRES_DB: arvis_lds
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arvis_lds"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass dev_password_change_in_prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DEBUG: "true"
      DATABASE_URL: postgresql://arvis_lds:dev_password_change_in_prod@postgres:5432/arvis_lds
      REDIS_URL: redis://:dev_password_change_in_prod@redis:6379/0
      USE_TLS: "false"
      PYTHONPATH: "/app"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
    command: uvicorn lds.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
