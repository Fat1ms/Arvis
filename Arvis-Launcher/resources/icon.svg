<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a3a"/>
      <stop offset="100%" style="stop-color:#2b2b2b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6496ff"/>
      <stop offset="100%" style="stop-color:#4080ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGrad)" stroke="#4a4a4a" stroke-width="4"/>
  
  <!-- Letter A stylized -->
  <path d="M128 50 L80 180 L95 180 L105 150 L151 150 L161 180 L176 180 L128 50 Z M110 135 L128 80 L146 135 Z" 
        fill="url(#accentGrad)" filter="url(#glow)"/>
  
  <!-- AI circuit pattern (decorative) -->
  <g stroke="#6496ff" stroke-width="2" fill="none" opacity="0.5">
    <circle cx="128" cy="128" r="95" stroke-dasharray="8,4"/>
    <line x1="40" y1="128" x2="55" y2="128"/>
    <line x1="201" y1="128" x2="216" y2="128"/>
    <line x1="128" y1="40" x2="128" y2="55"/>
    <line x1="128" y1="201" x2="128" y2="216"/>
    <circle cx="40" cy="128" r="4" fill="#6496ff"/>
    <circle cx="216" cy="128" r="4" fill="#6496ff"/>
    <circle cx="128" cy="40" r="4" fill="#6496ff"/>
    <circle cx="128" cy="216" r="4" fill="#6496ff"/>
  </g>
  
  <!-- Microphone icon (voice assistant indicator) -->
  <g transform="translate(180, 170)" fill="#888888">
    <rect x="0" y="0" width="16" height="24" rx="8" />
    <path d="M-4 18 L-4 26 Q8 34 20 26 L20 18" stroke="#888888" stroke-width="2" fill="none"/>
    <line x1="8" y1="30" x2="8" y2="36" stroke="#888888" stroke-width="2"/>
    <line x1="2" y1="36" x2="14" y2="36" stroke="#888888" stroke-width="2"/>
  </g>
</svg>
